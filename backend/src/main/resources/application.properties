
server.port=${PORT:8000}
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3308/compressor_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:saibaba}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jackson.serialization.indent-output=false
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-production-value}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.model=${OPENROUTER_MODEL:nvidia/nemotron-3-ultra-550b-a55b:free}
